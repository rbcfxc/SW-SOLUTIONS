<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Metsing.store — Ready-made online stores, business websites and Company Consultation in South Africa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072A1F"/>
      <stop offset="100%" stop-color="#0B3D2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#C8F55A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#C8F55A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand header -->
  <g transform="translate(80, 72)">
    <rect width="56" height="56" rx="16" fill="#C8F55A"/>
    <path d="M14 40V18l14 13 14-13v22" fill="none" stroke="#072A1F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#FBF8F2">Metsing<tspan fill="#C8F55A">.store</tspan></text>
  </g>

  <!-- Main headline -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#FBF8F2">Get your own online store,</text>
  <text x="80" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#C8F55A">ready to sell in 48 hours.</text>

  <!-- Sub-copy -->
  <text x="80" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#D5E4DC">Ready-made dropshipping stores &amp; business websites from R1,000 once-off.</text>
  <text x="80" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#9FB0A7">Plus Company Consultation: CIPC, CSD, CIDB &amp; COIDA registrations.</text>

  <!-- Badges -->
  <g transform="translate(80, 468)">
    <rect width="270" height="62" rx="31" fill="#C8F55A"/>
    <text x="135" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#072A1F">From R1,000 once-off</text>

    <rect x="290" width="330" height="62" rx="31" fill="#145A43" stroke="#2E8B67" stroke-width="2"/>
    <text x="455" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#FBF8F2">Company Reg from R350</text>
  </g>
</svg>
